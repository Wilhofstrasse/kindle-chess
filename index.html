<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
		<meta name="keywords" content="Chess, Engine, Javascript, Play Chess, Chess Program, Javascript Chess, Game">
		<title>Kindle Chess</title>
		<link href="stylesheets/styles.css?v=10" rel="stylesheet" type="text/css">
		<script type="text/javascript"> if (!window.console) console = {log: function() {}}; </script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q94743BW9M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q94743BW9M');
</script>
	</head>
	<body>
		<div id="Board">
		</div>
		<div id="Controls">
			<div class="ctrl-row">
				<select id="WhitePlayerSelect"></select>
				<select id="GameMode"><option value="computer">vs AI</option><option value="twoplayer">2P</option></select>
				<select id="BlackPlayerSelect"></select>
				<select id="ThinkTimeChoice">
					<option value="0.2">0.2s</option>
					<option value="0.5">0.5s</option>
					<option value="1" selected>1s</option>
					<option value="2">2s</option>
					<option value="4">4s</option>
					<option value="8">8s</option>
				</select>
			</div>
			<div class="ctrl-row">
				<button id="NewGameButton">New</button>
				<button id="SearchButton">Move</button>
				<button id="TakeButton">Undo</button>
				<button id="FlipButton">Flip</button>
				<label class="hint-label"><input type="checkbox" id="HintsToggle">Hint</label>
			</div>
		</div>
		<div id="Info">
			<span id="PlayerInfo"></span>
			<span id="HintDisplay"></span>
			<span id="GameStatus"></span>
		</div>
		<div id="AddPlayer">
			<input type="text" id="NewPlayerName" placeholder="Add player" maxlength="12">
			<button id="AddPlayerBtn">+</button>
		</div>
		<div id="Hidden">
			<span id="BestOut"></span>
			<span id="DepthOut"></span>
			<span id="ScoreOut"></span>
			<span id="NodesOut"></span>
			<span id="OrderingOut"></span>
			<span id="TimeOut"></span>
			<span id="currentFenSpan"></span>
			<span id="LoadingBook"></span>
			<div id="ThinkingImageDiv"></div>
		</div>
		<script src="js/jquery-1.10.1.min.js"></script>
		<!--<script src="js/all.js"></script>-->
		<!--<script src="js/all_comp.js"></script>-->
		<script src="js/defs.js"></script>
		<script src="js/io.js"></script>
		<script src="js/board.js"></script>
		<script src="js/movegen.js"></script>
		<script src="js/makemove.js"></script>
		<script src="js/perft.js"></script>
		<script src="js/evaluate.js"></script>
		<script src="js/pvtable.js"></script>
		<script src="js/search.js"></script>
		<script src="js/protocol.js"></script>
		<script src="js/players.js?v=12"></script>
		<script src="js/gui.js?v=14"></script>
		<script src="js/main.js?v=14"></script>
	</body>
</html>
